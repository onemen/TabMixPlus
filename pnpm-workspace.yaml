autoInstallPeers: true
saveExact: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - 'typescript'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - '@typescript/native-preview*'
  - fast-uri@3.1.8
  - brace-expansion@5.0.12
  - js-yaml@5.4.1
  - js-yaml@5.4.2

catalog:
  eslint: ^10.11.0

overrides:
  eslint: 'catalog:'
  brace-expansion: '>=5.0.12'
  fast-uri@3: '>=3.1.7 <4.0.0'
  js-yaml: '>=5.4.1'
  nanoid@3: '>=3.3.17 <4.0.0'
  postcss@8: '>=8.5.23 <9.0.0'
  colord@2: '>=2.9.4 <3.0.0'

blockExoticSubdeps: true
trustPolicy: no-downgrade
