autoInstallPeers: true
saveExact: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - 'typescript'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - fast-uri@3.1.9
  - minimatch@11.0.3
  - '@isaacs/nonrecursive-glob-match@1.0.3'

catalog:
  eslint: ^10.13.0

overrides:
  eslint: 'catalog:'
  minimatch: '>=11.0.1'

blockExoticSubdeps: true
trustPolicy: no-downgrade
