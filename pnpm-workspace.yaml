autoInstallPeers: true
saveExact: true
minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - 'typescript'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - '@typescript/native-preview*'
  - fast-uri@3.1.4
  - brace-expansion@5.0.8
  - js-yaml@5.2.2

catalog:
  eslint: ^10.7.0

overrides:
  eslint: 'catalog:'
  brace-expansion: '>=5.0.8'
  fast-uri@3: '>=3.1.4 <4.0.0'
  js-yaml: '>=5.2.2'

trustPolicy: no-downgrade
